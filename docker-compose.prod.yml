name: navegaya

x-app: &app
  image: navegaya:vps
  build: .
  env_file:
    - ${VPS_ENV_FILE:-.env.vps}
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_SSLMODE: prefer
    PORT: "8080"
    RUN_SCHEDULER: "0"
  volumes:
    - storage_data:/var/www/html/storage
  restart: unless-stopped

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  app:
    <<: *app
    command: ["sh", "-c", "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public storage/app/private storage/app/backups && chown -R www-data:www-data storage bootstrap/cache || true && exec sh deploy/railway-start.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-8080}/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 180s

  worker:
    <<: *app
    command: ["sh", "-c", "until curl -fsS http://app:8080/up >/dev/null; do sleep 2; done; exec sh deploy/railway-queue.sh"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["sh", "-c", "until curl -fsS http://app:8080/up >/dev/null; do sleep 2; done; exec php artisan schedule:work --no-interaction"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
  caddy_data:
  caddy_config:
